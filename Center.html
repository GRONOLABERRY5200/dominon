<!DOCTYPE html>
<html>
<head>
    <title>dominon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #080808;
            color: black;
        }

        /* Navigation bar */
        .navbar {
            height: 90px;
            background: white;

            display: flex;
            align-items: center;
            justify-content: space-around;

            font-size: 30px;
        }

        .navbar a {
            color: black;
            text-decoration: none;
        }

        /* Background */
        .background {
            min-height: calc(100vh - 90px);
            background-image: url("POOL.png");
            background-size: cover;
            background-position: center;
            padding: 40px 25px;
        }

        /* Mobile layout */
        @media (max-width: 700px) {
            .navbar {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <div class="navbar">

        <a href="index.html">dominon</a>

        <p>Be nonchalant</p>

        <a href="index.html">home</a>

    </div>

    <!-- Background (blank) -->
    <div class="background"></div>

</body>
</html>
