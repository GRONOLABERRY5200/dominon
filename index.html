
<!DOCTYPE html>
<html>
<head>
    <title>dominon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #080808;
            color: black;
        }

        /* Navigation bar */
        .navbar {
            height: 90px;
            background: white;

            display: flex;
            align-items: center;
            justify-content: space-around;

            font-size: 30px;
        }

        .navbar a {
            color: black;
            text-decoration: none;
        }

        /* Background */
        .background {
            min-height: 100vh;
            background-image: url("LED.png");
            background-size: cover;
            background-position: center;
            padding: 40px 25px;
        }

        /* Main layout */
        .container {
            display: grid;
            grid-template-columns: 40% 55%;
            gap: 10%;
        }

        /* Image link boxes */
        .image-box {
            background: white;
            border: 5px solid black;
            height: 240px;
            margin-bottom: 40px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Paragraph box */
        .paragraph {
            background: white;
            border: 5px solid black;
            min-height: 250px;
            padding: 40px;
            font-size: 30px;
        }

        /* Mobile layout */
        @media (max-width: 700px) {
            .navbar {
                font-size: 18px;
            }

            .container {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .paragraph {
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->
    <div class="navbar">

        <a href="index.html">dominon</a>

        <p>Be nonchalant</p>

        <a href="index.html">home</a>

    </div>

    <!-- Background -->
    <div class="background">

        <div class="container">

            <!-- Left side -->
            <div>

                <!-- First image link -->
                <a href="#" onclick="playSound()"
                   class="image-box">

                    <img src="In construction!.png"
                         alt="Center">

                </a>

                <!-- Second image link -->
                <a href="COMINGSOON" onclick="playSound()"
                   class="image-box">

                    <img src="Shop.png"
                         alt="Shop">

                </a>

            </div>

            <!-- Right side -->
            <div class="paragraph">

                <p>
                    A net for all things pixel.
                </p>

                <p>
                    View pixel art, 
                </p>

            </div>

        </div>

    </div>

    <!-- Sound -->
    <audio id="clickSound" src="click.mp3"></audio>

    <script>

        function playSound() {
            document.getElementById("clickSound").currentTime = 0;
            document.getElementById("clickSound").play();
        }

    </script>

</body>
</html>
